<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transmission Nationale - Liaison des Unités</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --border-color: #1f2937;
            --accent-blue: #0055A5;
            --danger-color: #ef4444;
            --warning-color: #f59e0b;
            --success-color: #10b981;
            --procedure-color: #8b5cf6;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --discord-color: #5865F2;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; padding: 25px 20px; }
        
        header { max-width: 1400px; margin: 0 auto 25px auto; }
        .header-container { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
        .header-title-container { display: flex; align-items: center; gap: 15px; }
        .header-logo { height: 48px; width: auto; object-fit: contain; }
        header h1 { font-size: 1.8rem; font-weight: 700; }
        header p { color: var(--text-muted); margin-top: 2px; font-size: 0.85rem; }

        .btn-discord-top {
            background-color: var(--discord-color);
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.88rem;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: background 0.2s;
        }
        .btn-discord-top:hover { background-color: #4752C4; }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--card-bg);
            padding: 6px 14px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
        }
        .user-avatar { width: 30px; height: 30px; border-radius: 50%; }

        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 320px 1fr 300px;
            gap: 20px;
        }

        @media (max-width: 1100px) { .main-container { grid-template-columns: 1fr; } }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .card h2 {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 6px; }
        .form-control {
            width: 100%;
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 12px;
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s, background-color 0.2s;
        }
        .form-control:focus { border-color: var(--accent-blue); }
        .form-control.highlight { border-color: var(--success-color); background-color: rgba(16, 185, 129, 0.1); }

        .btn-submit {
            width: 100%;
            background-color: var(--accent-blue);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 15px;
        }
        .btn-submit:hover { opacity: 0.9; }

        .units-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .stats-badge { background-color: rgba(0, 85, 165, 0.2); color: #60a5fa; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; }

        .units-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; max-height: 600px; overflow-y: auto; }

        .unit-card { background-color: rgba(255, 255, 255, 0.02); border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; }
        .unit-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .unit-indicatif { font-weight: 700; font-size: 0.95rem; display: flex; align-items: center; gap: 8px; }
        .unit-logo { height: 20px; width: auto; }

        .status-select { font-size: 0.7rem; padding: 4px 8px; border-radius: 12px; font-weight: 600; text-transform: uppercase; border: none; cursor: pointer; outline: none; }
        .status-patrouille { background-color: rgba(16, 185, 129, 0.15); color: var(--success-color); }
        .status-intervention { background-color: rgba(245, 158, 11, 0.15); color: var(--warning-color); }
        .status-procedure { background-color: rgba(139, 92, 246, 0.15); color: var(--procedure-color); }
        .status-indisponible { background-color: rgba(239, 68, 68, 0.15); color: var(--danger-color); }

        .unit-details { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 12px; line-height: 1.5; }
        .effectifs-input { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-color); border-radius: 6px; padding: 4px 8px; color: var(--text-main); font-size: 0.85rem; width: 100%; margin-top: 2px; }
        .unit-footer { display: flex; justify-content: flex-end; border-top: 1px solid var(--border-color); padding-top: 10px; }
        .btn-delete { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 0.85rem; }
        .btn-delete:hover { color: var(--danger-color); }

        .no-units { grid-column: 1 / -1; text-align: center; padding: 40px; color: var(--text-muted); font-style: italic; }
        
        .agents-list { max-height: 580px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 4px; }
        .agent-card { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; background: rgba(255, 255, 255, 0.02); border: 1px solid var(--border-color); border-radius: 6px; }
        .btn-add-agent { background: #5865F2; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 0.78rem; font-weight: 600; display: flex; align-items: center; gap: 4px; transition: background 0.2s; }
        .btn-add-agent:hover { background: #4752C4; }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <div class="header-title-container">
                <img src="https://i.ibb.co/dZ0ctkQ/image.png" alt="Logo Centrale" class="header-logo">
                <div>
                    <h1>Transmission Nationale</h1>
                    <p>Interface de commandement & Authentification Discord</p>
                </div>
            </div>
            <div id="auth-bar"></div>
        </div>
    </header>

    <div class="main-container">
        <!-- Formulaire Prise de Service (Création de Patrouille) -->
        <div class="card" id="form-card">
            <h2><i class="fa-solid fa-circle-plus" style="color: var(--accent-blue);"></i> Prise de Service</h2>
            <form id="form-unite">
                <div class="form-group">
                    <label for="indicatif">Indicatif de l'unité</label>
                    <input type="text" id="indicatif" class="form-control" placeholder="ex: Alpha 1, BAC 3" required autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="division">Division / Service</label>
                    <select id="division" class="form-control">
                        <option value="Sécurité Publique (Standard)">Sécurité Publique (Standard)</option>
                        <option value="Brigade Anti-Criminalité (BAC)">Brigade Anti-Criminalité (BAC)</option>
                        <option value="Police Judiciaire (PJ)">Police Judiciaire (PJ)</option>
                        <option value="RAID">RAID</option>
                        <option value="CRS">CRS</option>
                        <option value="Brigade Motorisée (BMO)">Brigade Motorisée (BMO)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="armement">Armement</label>
                    <select id="armement" class="form-control">
                        <option value="Léger">Léger</option>
                        <option value="Moyen">Moyen</option>
                        <option value="Lourd">Lourd</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="coequipiers-input">Agents / Composition</label>
                    <input type="text" id="coequipiers-input" class="form-control" placeholder="Cliquez sur + Ajouter à droite..." autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="statut">Statut initial</label>
                    <select id="statut" class="form-control">
                        <option value="En patrouille">En patrouille</option>
                        <option value="Sur intervention">Sur intervention</option>
                        <option value="En procédure">En procédure</option>
                        <option value="Indisponible">Indisponible / QG</option>
                    </select>
                </div>
                <button type="submit" class="btn-submit"><i class="fa-solid fa-paper-plane"></i> Créer la patrouille</button>
            </form>
        </div>

        <!-- Unités en Ligne -->
        <div class="card">
            <div class="units-header">
                <h2><i class="fa-solid fa-list-check" style="color: var(--accent-blue);"></i> Unités en Ligne</h2>
                <span id="stats-count" class="stats-badge">0 unité(s) active(s)</span>
            </div>
            <div id="units-grid" class="units-grid"></div>
        </div>

        <!-- Agents Disponibles -->
        <div class="card">
            <h2><i class="fa-solid fa-users" style="color: var(--accent-blue);"></i> Agents disponibles</h2>
            <div id="panneau-agents-droite" class="agents-list">
                <p style="color: var(--text-muted); font-size: 0.85rem; text-align: center;">Chargement des agents...</p>
            </div>
        </div>
    </div>

    <script>
        let currentUser = null;

        async function init() {
            chargerAgentsDisponibles();

            try {
                const resAuth = await fetch('/api/me');
                const authData = await resAuth.json();
                const authBar = document.getElementById('auth-bar');

                if (authData.authenticated) {
                    currentUser = authData.user;
                    authBar.innerHTML = `
                        <div class="user-profile">
                            <img src="${currentUser.avatar}" class="user-avatar" alt="Avatar">
                            <span><strong>${currentUser.username}</strong></span>
                            <a href="/api/auth/logout" style="color: var(--danger-color); margin-left: 8px; font-size: 0.85rem;" title="Déconnexion"><i class="fa-solid fa-right-from-bracket"></i></a>
                        </div>
                    `;

                    // Si l'utilisateur est connecté et le champ agent est vide, on l'ajoute par défaut
                    const inputCoep = document.getElementById('coequipiers-input');
                    if (inputCoep && inputCoep.value.trim() === '') {
                        inputCoep.value = currentUser.username;
                    }
                } else {
                    authBar.innerHTML = `
                        <a href="/api/auth/login" class="btn-discord-top">
                            <i class="fa-brands fa-discord"></i> Se connecter avec Discord
                        </a>
                    `;
                }
            } catch (e) {
                console.error("Erreur d'authentification:", e);
            }

            document.getElementById('form-unite').addEventListener('submit', prendreService);
            chargerUnites();
            setInterval(chargerUnites, 5000);
        }

        async function chargerAgentsDisponibles() {
            const container = document.getElementById('panneau-agents-droite');
            try {
                const response = await fetch('/api/members');
                const agents = await response.json();
                
                if (agents.error) {
                    container.innerHTML = `<p style="color: var(--danger-color); font-size: 0.8rem; text-align: center;">${agents.error}</p>`;
                    return;
                }

                if (!Array.isArray(agents) || agents.length === 0) {
                    container.innerHTML = '<p style="color: var(--text-muted); font-size: 0.85rem; text-align: center;">Aucun agent disponible.</p>';
                    return;
                }

                container.innerHTML = '';
                agents.forEach(agent => {
                    const card = document.createElement('div');
                    card.className = 'agent-card';
                    card.innerHTML = `
                        <div style="display: flex; align-items: center; gap: 8px; overflow: hidden;">
                            <img src="${agent.avatar}" width="28" height="28" style="border-radius: 50%; flex-shrink: 0;">
                            <span style="color: white; font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${agent.username}</span>
                        </div>
                        <button class="btn-add-agent" onclick="ajouterCoequipier('${agent.username.replace(/'/g, "\\'")}')">+ Ajouter</button>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                console.error('Erreur chargement agents :', err);
                container.innerHTML = '<p style="color: var(--danger-color); font-size: 0.8rem; text-align: center;">Erreur serveur lors du chargement.</p>';
            }
        }

        function ajouterCoequipier(nom) {
            const inputCoequipiers = document.getElementById('coequipiers-input');
            if (!inputCoequipiers) return;

            let actuels = inputCoequipiers.value.split(',').map(s => s.trim()).filter(s => s.length > 0);
            
            // Évite d'ajouter deux fois le même agent
            if (!actuels.includes(nom)) {
                actuels.push(nom);
                inputCoequipiers.value = actuels.join(', ');
            }

            // Animation visuelle de confirmation
            inputCoequipiers.classList.add('highlight');
            setTimeout(() => inputCoequipiers.classList.remove('highlight'), 400);
        }

        async function chargerUnites() {
            try {
                const res = await fetch('/api/unites');
                const unites = await res.json();
                const unitsGrid = document.getElementById('units-grid');
                const statsCount = document.getElementById('stats-count');

                statsCount.textContent = `${unites.length} unité(s) active(s)`;
                unitsGrid.innerHTML = '';

                if (unites.length === 0) {
                    unitsGrid.innerHTML = '<div class="no-units">Aucune patrouille en cours pour le moment.</div>';
                    return;
                }

                unites.forEach((u, index) => {
                    let statusClass = 'status-patrouille';
                    if (u.statut === 'Sur intervention') statusClass = 'status-intervention';
                    if (u.statut === 'En procédure') statusClass = 'status-procedure';
                    if (u.statut === 'Indisponible') statusClass = 'status-indisponible';

                    const card = document.createElement('div');
                    card.className = 'unit-card';
                    card.innerHTML = `
                        <div class="unit-top">
                            <span class="unit-indicatif">
                                <img src="https://i.ibb.co/dZ0ctkQ/image.png" alt="Logo" class="unit-logo"> 
                                ${u.indicatif}
                            </span>
                            <select class="status-select ${statusClass}" onchange="changerStatut(${index}, this.value)">
                                <option value="En patrouille" ${u.statut === 'En patrouille' ? 'selected' : ''}>En patrouille</option>
                                <option value="Sur intervention" ${u.statut === 'Sur intervention' ? 'selected' : ''}>Sur intervention</option>
                                <option value="En procédure" ${u.statut === 'En procédure' ? 'selected' : ''}>En procédure</option>
                                <option value="Indisponible" ${u.statut === 'Indisponible' ? 'selected' : ''}>Indisponible</option>
                            </select>
                        </div>
                        <div class="unit-details">
                            <div><strong>Service :</strong> ${u.division}</div>
                            <div><strong>Armement :</strong> ${u.armement}</div>
                            <div style="margin-top: 6px;">
                                <strong>Composition :</strong>
                                <input type="text" class="effectifs-input" value="${u.effectifs}" onchange="changerEffectifs(${index}, this.value)" autocomplete="off">
                            </div>
                        </div>
                        <div class="unit-footer">
                            <button class="btn-delete" onclick="finDeService(${index})">
                                <i class="fa-solid fa-circle-xmark"></i> Fin de service
                            </button>
                        </div>
                    `;
                    unitsGrid.appendChild(card);
                });
            } catch (e) {
                console.error("Erreur de chargement des unités:", e);
            }
        }

        async function prendreService(e) {
            e.preventDefault();
            const body = {
                indicatif: document.getElementById('indicatif').value,
                division: document.getElementById('division').value,
                armement: document.getElementById('armement').value,
                statut: document.getElementById('statut').value,
                coéquipiers: document.getElementById('coequipiers-input').value
            };

            await fetch('/api/unites/prise-de-service', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });

            // Réinitialisation du champ d'indicatif et recharge
            document.getElementById('indicatif').value = '';
            chargerUnites();
        }

        async function changerStatut(index, nouveauStatut) {
            await fetch(`/api/unites/${index}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ statut: nouveauStatut })
            });
            chargerUnites();
        }

        async function changerEffectifs(index, nouveauxEffectifs) {
            await fetch(`/api/unites/${index}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ effectifs: nouveauxEffectifs })
            });
        }

        async function finDeService(index) {
            await fetch(`/api/unites/${index}`, { method: 'DELETE' });
            chargerUnites();
        }

        init();
    </script>
</body>
</html>
