<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transmission Nationale</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: #1e293b;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 450px;
            width: 90%;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
            color: #38bdf8;
        }

        .btn-discord {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background-color: #5865F2;
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            transition: background-color 0.2s ease;
        }

        .btn-discord:hover {
            background-color: #4752C4;
        }

        .user-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid #38bdf8;
        }

        .username {
            font-size: 1.2rem;
            font-weight: bold;
        }

        .btn-logout {
            margin-top: 15px;
            background-color: #ef4444;
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .btn-logout:hover {
            background-color: #dc2626;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Transmission Nationale</h1>

        <!-- Zone non-connecté -->
        <div id="login-section">
            <p style="margin-bottom: 1.5rem; color: #94a3b8;">Connectez-vous avec votre compte Discord pour accéder à la plateforme.</p>
            <a href="/api/auth/discord" class="btn-discord">
                Se connecter avec Discord
            </a>
        </div>

        <!-- Zone connecté -->
        <div id="user-section" class="hidden">
            <div class="user-card">
                <img id="user-avatar" class="avatar" src="" alt="Avatar">
                <div class="username" id="user-name"></div>
                <p style="color: #4ade80;">✔ Accès autorisé</p>
                <a href="/api/logout" class="btn-logout">Se déconnecter</a>
            </div>
        </div>
    </div>

    <script>
        // Vérification de la session utilisateur
        async function checkAuth() {
            try {
                const response = await fetch('/api/user');
                const data = await response.json();

                if (data.authenticated) {
                    document.getElementById('login-section').classList.add('hidden');
                    document.getElementById('user-section').classList.remove('hidden');

                    document.getElementById('user-name').textContent = data.user.nickname || data.user.username;
                    if (data.user.avatar) {
                        document.getElementById('user-avatar').src = data.user.avatar;
                    } else {
                        document.getElementById('user-avatar').src = 'https://cdn.discordapp.com/embed/avatars/0.png';
                    }
                }
            } catch (err) {
                console.error("Erreur lors de la vérification de session :", err);
            }
        }

        checkAuth();
    </script>
</body>
</html>
